<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>국회 요구자료 현업 회신</title>
  <style>
    .department-picker{display:flex;align-items:center;gap:14px;padding:22px 24px}.department-picker label{font-weight:900;color:var(--navy)}.department-picker select{min-width:260px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:white;font:inherit}.department-picker .badge{margin-left:auto}
    .case-list{display:grid;gap:18px;margin-top:18px}.case-card{padding:24px}.case-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.case-head h2{margin:0;color:var(--navy);font-size:1.12rem}.case-meta{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0 0}.request-text{margin:18px 0;padding:16px;border-radius:13px;background:#f5f8fb}.request-text p{margin:0}.request-text small{display:block;margin-top:6px;color:var(--muted)}
    .reply-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:18px}.reply-box{padding:17px;border:1px solid var(--line);border-radius:14px;background:#fbfcfe}.reply-box h3{margin:0 0 11px;font-size:.95rem;color:var(--navy)}.reply-box label{display:block;margin:10px 0 4px;color:var(--muted);font-size:.78rem;font-weight:900}.reply-box input,.reply-box textarea,.reply-box select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:white;font:inherit;color:var(--ink)}.reply-box textarea{min-height:82px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.file-status{margin-top:6px;color:var(--muted);font-size:.78rem}.existing{margin-top:12px;padding:10px;border-radius:10px;background:#eaf6f1;color:#28634f;font-size:.82rem}
    @media(max-width:820px){.reply-grid{grid-template-columns:1fr}.department-picker{align-items:flex-start;flex-direction:column}.department-picker select{width:100%;min-width:0}.department-picker .badge{margin-left:0}}
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="shell nav" aria-label="주요 화면">
      <div class="brand">A부 국회 요구자료</div>
      <a href="./index.html">시작 화면</a>
      <a href="./assign.html">배분</a>
      <a href="./dept.html" class="active" aria-current="page">현업 회신</a>
      <a href="#" class="disabled" aria-disabled="true" title="S8에서 구현">취합 · S8</a>
      <span class="badge storage-mode" data-storage-mode></span>
    </nav>
  </header>

  <main class="shell">
    <section class="hero" data-reveal>
      <div>
        <p class="eyebrow">Department response</p>
        <h1>내 과에 배분된 문항만<br>확인하고 회신합니다.</h1>
        <p>회신 엑셀과 메모를 제출하거나, 소관이 아니면 사유와 희망 과를 적어 재배정을 요청하세요.</p>
      </div>
    </section>

    <section class="card department-picker" data-reveal>
      <label for="departmentSelect">내 과</label>
      <select id="departmentSelect"><option value="">과를 선택하세요</option></select>
      <span class="badge" id="caseCount">0건</span>
    </section>
    <div class="notice" id="notice" aria-live="polite">내 과를 선택하면 배분된 문항이 표시됩니다.</div>
    <section class="case-list" id="caseList" aria-live="polite"></section>
  </main>

  <script src="./lib/papaparse.min.js"></script>
  <script src="./lib/xlsx.full.min.js"></script>
  <script src="./common.js"></script>
  <script src="./engine.js"></script>
  <script type="module">
    AppCommon.injectStyles(); AppCommon.setupReveal(); AppCommon.showStorageMode();
    const elements = { department: document.querySelector("#departmentSelect"), count: document.querySelector("#caseCount"), list: document.querySelector("#caseList"), notice: document.querySelector("#notice") };
    let departments = []; let cases = []; let historyRows = []; const uploads = new Map();

    function setNotice(message, error = false) { elements.notice.textContent = message; elements.notice.classList.toggle("error", error); }
    function assigned(item, department) { return item.주관과 === department || item.협조과?.includes(department); }
    function enriched(items) {
      return items.map((item) => ({ ...item, 후보: item.후보?.length ? item.후보 : RequirementEngine.classify(item.요구내용) }));
    }
    function options(selected = "") { return departments.map((department) => `<option value="${AppCommon.escapeHtml(department)}"${department === selected ? " selected" : ""}>${AppCommon.escapeHtml(department)}</option>`).join(""); }
    function render() {
      const department = elements.department.value;
      if (!department) { elements.count.textContent = "0건"; elements.list.innerHTML = '<div class="empty">내 과를 먼저 선택하세요.</div>'; return; }
      const visible = cases.filter((item) => assigned(item, department));
      elements.count.textContent = `${visible.length}건`;
      if (!visible.length) { elements.list.innerHTML = '<div class="card empty">이 과에 배분된 문항이 없습니다.</div>'; return; }
      elements.list.innerHTML = visible.map((item) => {
        const canAct = ["배분확정", "회신중"].includes(item.상태);
        const ownReply = item.과별회신?.[department];
        const latest = item.재배정?.at(-1);
        const details = [item.세부항목, item.비고].filter(Boolean).join(" · ");
        return `<article class="card case-card" data-id="${AppCommon.escapeHtml(item.id)}">
          <div class="case-head"><div><h2>${AppCommon.escapeHtml(item.의원)} · ${item.문항번호}번</h2><div class="case-meta"><span class="badge ${item.상태 === "회신완료" ? "confirmed" : "wait"}">${AppCommon.escapeHtml(item.상태)}</span><span class="badge">주관 ${AppCommon.escapeHtml(item.주관과)}</span>${item.협조과.map((value) => `<span class="badge">협조 ${AppCommon.escapeHtml(value)}</span>`).join("")}</div></div><span class="badge">기한 ${AppCommon.escapeHtml(item.제출기한)}</span></div>
          <div class="request-text"><p>${AppCommon.escapeHtml(item.요구내용)}</p>${details ? `<small>${AppCommon.escapeHtml(details)}</small>` : ""}${AppCommon.historyHtml(AppCommon.findHistory(item, historyRows))}</div>
          ${latest && item.상태 === "재배정요청" ? `<div class="notice"><b>재배정 요청됨</b> · ${AppCommon.escapeHtml(latest.사유)} · 희망 과 ${AppCommon.escapeHtml(latest.희망과 || "미지정")}</div>` : ""}
          <div class="reply-grid">
            <div class="reply-box"><h3>회신 제출</h3><label>회신 엑셀 올리기</label><input class="reply-file" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" ${canAct ? "" : "disabled"}><div class="file-status">${uploads.get(item.id)?.파일명 ? AppCommon.escapeHtml(uploads.get(item.id).파일명) : "선택된 파일 없음"}</div><label>메모</label><textarea class="reply-memo" placeholder="자료 없음, 별도 제출 등" ${canAct ? "" : "disabled"}>${AppCommon.escapeHtml(ownReply?.메모 || "")}</textarea><div class="actions"><button class="btn reply-submit" ${canAct ? "" : "disabled"}>회신 제출</button></div>${ownReply ? `<div class="existing">최근 회신 · ${AppCommon.escapeHtml(ownReply.파일명 || "파일 없음")} · ${AppCommon.escapeHtml(ownReply.일시 || "")}</div>` : ""}</div>
            <div class="reply-box"><h3>재배정 요청</h3><label>사유</label><textarea class="reassign-reason" placeholder="소관이 아닌 이유를 입력하세요." ${canAct ? "" : "disabled"}></textarea><label>희망 과</label><select class="desired-department" ${canAct ? "" : "disabled"}><option value="">미지정</option>${options()}</select><div class="actions"><button class="btn secondary reassign-submit" ${canAct ? "" : "disabled"}>재배정 요청</button></div></div>
          </div>
        </article>`;
      }).join("");
    }

    elements.list.addEventListener("change", async (event) => {
      if (!event.target.classList.contains("reply-file")) return;
      const card = event.target.closest("[data-id]"); const file = event.target.files[0]; if (!file) return;
      try {
        const workbook = XLSX.read(await file.arrayBuffer(), { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });
        uploads.set(card.dataset.id, { 파일명: file.name, 행: rows });
        card.querySelector(".file-status").textContent = `${file.name} · ${rows.length}행`;
      } catch (error) { setNotice(`엑셀을 읽지 못했습니다: ${error.message}`, true); }
    });

    elements.list.addEventListener("click", async (event) => {
      const card = event.target.closest("[data-id]"); if (!card) return;
      const department = elements.department.value;
      try {
        if (event.target.closest(".reply-submit")) {
          const upload = uploads.get(card.dataset.id) || { 파일명: "", 행: [] };
          const memo = card.querySelector(".reply-memo").value.trim();
          event.target.disabled = true;
          await AppCommon.applyRequest({ 작업: "회신", id: card.dataset.id, 과: department, 파일명: upload.파일명, 행: upload.행, 메모: memo }, departments);
          uploads.delete(card.dataset.id); cases = enriched((await AppCommon.loadDb(true)).cases); setNotice("회신을 제출했습니다."); render();
        }
        if (event.target.closest(".reassign-submit")) {
          const reason = card.querySelector(".reassign-reason").value.trim();
          const desired = card.querySelector(".desired-department").value;
          event.target.disabled = true;
          await AppCommon.applyRequest({ 작업: "재배정요청", id: card.dataset.id, 과: department, 사유: reason, 희망과: desired }, departments);
          cases = enriched((await AppCommon.loadDb(true)).cases); setNotice("재배정을 요청했습니다. 총괄 담당자가 다시 배분할 수 있습니다."); render();
        }
      } catch (error) { setNotice(error.message, true); event.target.disabled = false; }
    });

    elements.department.addEventListener("change", render);
    try {
      const [, loadedDepartments, loadedHistory, db] = await Promise.all([RequirementEngine.initialize(), AppCommon.loadDepartments(), AppCommon.loadHistory(), AppCommon.loadDb(true)]);
      departments = loadedDepartments; historyRows = loadedHistory; cases = enriched(db.cases);
      elements.department.insertAdjacentHTML("beforeend", options()); render();
    } catch (error) { setNotice(`${error.message} · 로컬 서버로 열었는지 확인하세요.`, true); }
  </script>
</body>
</html>
